<div class="overlay-backdrop">
  <form class="overlay-card" (ngSubmit)="submit()">
    <span class="logo-tile">MB</span>
    <h1 class="title">Set Your Password</h1>
    <p class="hint">
      You're signed in with a one-time passphrase from the commissioner. Pick your own password to
      continue — anything you'll remember is fine.
    </p>

    <label class="mbl-label" for="new-password">New password</label>
    <input
      class="mbl-input"
      id="new-password"
      name="newPassword"
      type="text"
      autocomplete="new-password"
      autocapitalize="none"
      spellcheck="false"
      [(ngModel)]="newPassword"
    />

    @if (error(); as message) {
      <p class="error">{{ message }}</p>
    }

    <button class="mbl-btn-primary" type="submit" [disabled]="busy()">Set Password</button>
  </form>
</div>
