<div class="login-wrap">
  <form class="login-card" (ngSubmit)="signIn()">
    <span class="logo-tile">MB</span>
    <h1 class="title">Sign in to the League</h1>

    <label class="mbl-label" for="username">Username</label>
    <input
      class="mbl-input"
      id="username"
      name="username"
      type="text"
      [(ngModel)]="username"
      autocomplete="username"
      autocapitalize="none"
      spellcheck="false"
    />

    <label class="mbl-label" for="password">Passphrase</label>
    <input
      class="mbl-input"
      id="password"
      name="password"
      type="password"
      [(ngModel)]="password"
      autocomplete="current-password"
    />

    @if (error(); as message) {
      <p class="error">{{ message }}</p>
    }

    <button class="mbl-btn-primary" type="submit" [disabled]="busy()">Sign In</button>
    <button class="mbl-btn-outline" type="button" (click)="browseAsGuest()">Browse Without Signing In</button>
  </form>
</div>
