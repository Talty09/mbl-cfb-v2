name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push supersedes an in-flight deploy; never let two deploys race.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The Worker tests run inside workerd and read .dev.vars for secrets. No
      # test calls CFBD for real, but the binding must exist so behaviour in CI
      # matches local runs rather than depending on an absent file.
      - name: Provide a placeholder CFBD key
        run: echo "CFBD_API_KEY=ci-placeholder-not-a-real-key" > .dev.vars

      - run: npm run typecheck

      - run: npm run test

      - run: npm run build

  deploy:
    name: Migrate and deploy
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Assets are served from the build output, so the SPA must be built before
      # `wrangler deploy` uploads it.
      - run: npm run build

      # Migrations before deploy: new code must never meet an old schema. D1
      # migrations here are additive, so this ordering is safe.
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply mbl --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
# Before the deploy job can succeed, one-time setup is needed:
#
#   1. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to the GitHub
#      `production` environment (see GO_LIVE.md).
#   2. Set the Worker secret with `npx wrangler secret put CFBD_API_KEY`.
#   3. Seed accounts and import the 2026 paper draft using GO_LIVE.md.
#
# The `verify` job needs none of this and runs on every push and pull request.
